name: Production CI & Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Production Platform
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/Praveen04120/sprix-sales
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Production Application
        run: npm run build
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD || 'PraveenSPRIX@123' }}
          GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_FORM_ID: ${{ secrets.GOOGLE_FORM_ID }}

      - name: Verify Build Output
        run: |
          echo "SPRIX Hiring Platform production build successfully compiled and validated!"
          test -d .next || exit 1
